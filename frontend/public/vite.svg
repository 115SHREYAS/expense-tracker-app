<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="120" ry="120" fill="url(#mainGradient)" filter="url(#dropShadow)" />

  <circle cx="350" cy="160" r="50" fill="#10b981" opacity="0.9" />

  <g transform="translate(112, 128)">
    <rect x="0" y="160" width="70" height="120" rx="12" fill="#3b82f6" opacity="0.8" />
    
    <rect x="100" y="80" width="70" height="200" rx="12" fill="#3b82f6" opacity="0.9" />
    
    <rect x="200" y="0" width="70" height="280" rx="12" fill="#3b82f6" />
  </g>
</svg>